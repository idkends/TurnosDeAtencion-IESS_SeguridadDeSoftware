{% if form.non_field_errors %}
  <div role="alert" class="error">{% for e in form.non_field_errors %}<p>{{ e }}</p>{% endfor %}</div>
{% endif %}
{% for campo in form %}
  <div class="campo">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.errors %}
      <ul class="errorlist" id="{{ campo.id_for_label }}_error" role="alert">{% for e in campo.errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}
  </div>
{% endfor %}
