# Proxy inverso del perímetro: TLS, límites de solicitudes, tamaño y tiempo (informe §4.1, Anexo E).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Registros de acceso SIN secretos ni datos personales: sin cadena de consulta (la justificación de E18 va ahí), sin la
    # cédula de /interno/afiliados/{cedula} y sin los tokens de /enlaces y /cuenta/restablecer (R08, CWE-532, Anexo F).
    map $uri $uri_registro {
        "~^(?<p>/interno/afiliados/)[0-9]{10}$"   "${p}**********";
        "~^(?<p>/enlaces/).+$"                    "${p}[token]";
        "~^(?<p>/cuenta/restablecer/).+$"         "${p}[token]/";
        default                                 $uri;
    }
    log_format iess '$remote_addr [$time_local] "$request_method $uri_registro" $status $body_bytes_sent $request_time rid=$request_id';
    access_log /dev/stdout iess;

    # Cuerpo máximo 64 KB y tiempo de solicitud 10 s (Anexo E).
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    large_client_header_buffers 4 8k;

    # Límites gruesos por IP; los límites finos (por cuenta, por ruta) viven en la aplicación.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=cuenta:10m rate=30r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;

    upstream aplicacion { server app:8000; keepalive 16; }

    server {
        listen 8080;
        # Destino fijo: nunca se refleja la cabecera Host en la redirección.
        location / { return 301 https://localhost:8443$request_uri; }
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /certs/localhost.pem;
        ssl_certificate_key /certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        limit_req zone=general burst=60 nodelay;
        limit_conn conexiones 50;

        # Las respuestas que genera el propio proxy (límites, rutas bloqueadas) llevan las mismas cabeceras de seguridad que las de la
        # aplicación; las de la aplicación pasan intactas (proxy_intercept_errors está apagado). HSTS corto: es el de desarrollo.
        error_page 429 @limitado;
        error_page 403 @prohibido;
        location @limitado {
            default_type text/plain;
            include /etc/nginx/cabeceras_error.conf;
            add_header Retry-After 1 always;
            return 429 "Demasiadas solicitudes. Intente de nuevo en unos segundos.
";
        }
        location @prohibido {
            default_type text/plain;
            include /etc/nginx/cabeceras_error.conf;
            return 403 "Acceso denegado.
";
        }

        # E21: el estado del servicio solo se consulta desde la red interna (el healthcheck corre dentro del contenedor).
        location = /salud {
            allow 127.0.0.1;
            deny all;
            include /etc/nginx/proxy_aplicacion.conf;
        }
        # Rutas de identidad con un límite más estricto por IP (los límites finos viven en la aplicación).
        location ~ ^/(cuenta|cuentas|sesion)(/|$) {
            limit_req zone=cuenta burst=15 nodelay;
            include /etc/nginx/proxy_aplicacion.conf;
        }
        location / {
            include /etc/nginx/proxy_aplicacion.conf;
        }
    }
}
