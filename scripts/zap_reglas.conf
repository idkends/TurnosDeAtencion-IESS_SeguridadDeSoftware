# Reglas de ZAP baseline. Formato: <id><TAB><ACCION><TAB>(comentario). Acciones: IGNORE, INFO, WARN, FAIL.
# Todo IGNORE debe llevar su justificación; scripts/zap_resumen.py exige 0 altos y justificar todo medio.
10015	IGNORE	(Informativo) "Re-examine Cache-control": las páginas llevan no-store A PROPÓSITO (datos de sesión y de turnos).
10049	IGNORE	(Informativo) "Non-Storable Content": mismo motivo, no-store deliberado; los estáticos sí son cacheables e inmutables.
10112	IGNORE	(Informativo) "Session Management Response Identified": la aplicación usa sesiones por diseño (cookie __Host-, HttpOnly, Secure, SameSite).
10031	IGNORE	(Informativo) "User Controllable HTML Element Attribute": especialidad/establecimiento se validan contra el catálogo (lista blanca) y la plantilla escapa (autoescape); no hay XSS (prueba CA08/T14).
