{% extends "base.html" %}
{% block titulo %}Confirme su identidad{% endblock %}
{% block contenido %}
  <h1>Confirme su identidad</h1>
  <div class="tarjeta">
    <p>Para esta operación necesitamos que confirme nuevamente su clave y su segundo factor.</p>
    <form method="post" novalidate>{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "componentes/campos.html" %}
      <div class="acciones"><button class="boton" type="submit">Confirmar</button></div>
    </form>
  </div>
{% endblock %}
