# Zonas de confianza de la Figura 3 del informe, reflejadas como redes de Docker Compose:
#   perimetro  -> proxy (único servicio con puertos publicados en el host)
#   aplicacion -> proxy <-> app
#   datos      -> app <-> PostgreSQL y Redis (red interna: sin salida a Internet ni puertos en el host)
#   externos   -> app <-> servicios de terceros SIMULADOS (red interna aparte)
name: iess-turnos

networks:
  perimetro: {}
  aplicacion:
    internal: true
  datos:
    internal: true
  externos:
    internal: true

volumes:
  pgdata: {}
  bandeja: {}
  # Copias FUERA del volumen de la base (Anexo I): en producción serían almacenamiento remoto aparte.
  wal_archivo: {}   # segmentos WAL archivados (recuperación a un punto en el tiempo, PITR)
  respaldos: {}     # copias base cifradas, diarias

x-app-entorno: &app-entorno
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  URL_BASE: ${URL_BASE}
  HSTS_SEGUNDOS: ${HSTS_SEGUNDOS:-31536000}
  HMAC_TOKENS_CLAVE: ${HMAC_TOKENS_CLAVE}
  TOTP_CLAVES_CIFRADO: ${TOTP_CLAVES_CIFRADO}
  AUDITORIA_CLAVES: ${AUDITORIA_CLAVES}
  AUDITORIA_VERSION_ACTUAL: ${AUDITORIA_VERSION_ACTUAL:-1}
  DB_NAME: ${DB_NAME}
  DB_HOST: db
  REDIS_HOST: redis
  REDIS_CLAVE: ${REDIS_CLAVE}
  AFILIACION_ADAPTADOR: http
  AFILIACION_URL: http://afiliacion_sim:9001
  SERVICIOS_CLAVE_AFILIACION: ${SERVICIOS_CLAVE_AFILIACION}
  AGENDA_ADAPTADOR: http
  AGENDA_URL: http://agenda_sim:9002
  SERVICIOS_CLAVE_AGENDA: ${SERVICIOS_CLAVE_AGENDA}
  NOTIFICACIONES_ADAPTADOR: ${NOTIFICACIONES_ADAPTADOR:-consola}

# Endurecimiento común (Anexo H, §4.1): sin root (USER en las imágenes), sistema de archivos de solo lectura salvo /tmp y los volúmenes
# declarados, sin nuevos privilegios, sin capacidades de Linux, con límite de procesos y de recursos.
x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    <<: *endurecido
    mem_limit: 256m
    cpus: 2
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,uid=101,gid=101
    ports:
      - "127.0.0.1:${PUERTO_HTTPS:-8443}:8443"    # HTTPS de desarrollo (https://localhost:8443); solo accesible desde este equipo
      - "127.0.0.1:${PUERTO_HTTP:-18080}:8080"   # solo redirige a HTTPS (18080 para no chocar con servidores locales en 8080)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_aplicacion.conf:/etc/nginx/proxy_aplicacion.conf:ro
      - ./docker/nginx/cabeceras_error.conf:/etc/nginx/cabeceras_error.conf:ro
      - ./docker/certs:/certs:ro
    networks: [perimetro, aplicacion]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/salud"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  app:
    <<: *endurecido
    mem_limit: 1g
    cpus: 10
    build:
      context: .
      target: final
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
      HOME: /tmp
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-10}   # procesos de gunicorn; medido con scripts/carga.sh (T09)
    volumes:
      - bandeja:/var/bandeja
    networks: [aplicacion, datos, externos]
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      afiliacion_sim:
        condition: service_started
      agenda_sim:
        condition: service_started
    restart: unless-stopped

  # Tareas programadas: expira turnos sin confirmar (RT-05) y concilia los PENDIENTES con la agenda.
  tareas:
    <<: *endurecido
    mem_limit: 512m
    cpus: 1
    build:
      context: .
      target: final
    command: ["python", "manage.py", "ejecutar_tareas", "--cada", "60"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
    networks: [datos, externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('/tmp/tareas.vivo')"]
      interval: 30s
      timeout: 4s
      retries: 3
    depends_on:
      migrar:
        condition: service_completed_successfully
    restart: unless-stopped

  # Aplica migraciones con el rol dueño del esquema (la aplicación nunca puede hacer DDL).
  migrar:
    <<: *endurecido
    mem_limit: 512m
    cpus: 1
    build:
      context: .
      target: final
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_migraciones
      DB_CLAVE: ${DB_MIGRACIONES_CLAVE}
    networks: [datos]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # El arranque de la imagen oficial entra como root y baja a `postgres`: necesita estas cinco capacidades y ninguna otra.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 512
    mem_limit: 2g
    cpus: 4
    shm_size: 256m
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,uid=999,gid=999,mode=1777
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      DB_CLAVE: ${DB_CLAVE}
      DB_MIGRACIONES_CLAVE: ${DB_MIGRACIONES_CLAVE}
      DB_AUDITORIA_RO_CLAVE: ${DB_AUDITORIA_RO_CLAVE}
      DB_CLAVE_PRUEBAS: ${DB_CLAVE_PRUEBAS}
    # Archivado continuo de WAL para PITR: RPO objetivo de minutos (archive_timeout fuerza el cierre de segmentos).
    command:
      - sh
      - -c
      - |
        chown postgres:postgres /wal_archivo /respaldos
        exec docker-entrypoint.sh postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60           -c "archive_command=test ! -f /wal_archivo/%f && cp %p /wal_archivo/%f"
    volumes:
      - pgdata:/var/lib/postgresql
      - wal_archivo:/wal_archivo
      - respaldos:/respaldos
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks: [datos]   # sin "ports": PostgreSQL no se expone al host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    user: "999:1000"        # usuario `redis` (el comando propio omite el cambio de usuario del arranque oficial)
    <<: *endurecido
    mem_limit: 256m
    cpus: 1
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:size=16m,uid=999,gid=1000
    # Solo límites de solicitudes y caché: sin persistencia y sin datos personales.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_CLAVE\" --save '' --appendonly no"]
    environment:
      REDIS_CLAVE: ${REDIS_CLAVE}
      REDISCLI_AUTH: ${REDIS_CLAVE}
    networks: [datos]   # sin "ports"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Servicio de afiliación SIMULADO (tercero): autentica con token de servicio firmado y falla a propósito si se le pide.
  afiliacion_sim:
    <<: *endurecido
    mem_limit: 128m
    cpus: 0.5
    build:
      context: .
      target: final
    command: ["python", "-m", "apps.integraciones.simulados.afiliacion_servidor"]
    environment:
      SERVICIOS_CLAVE_AFILIACION: ${SERVICIOS_CLAVE_AFILIACION}
      AFILIACION_SIM_PUERTO: "9001"
    networks: [externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9001), 2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  agenda_sim:
    <<: *endurecido
    mem_limit: 128m
    cpus: 0.5
    build:
      context: .
      target: final
    command: ["python", "-m", "apps.integraciones.simulados.agenda_servidor"]
    environment:
      SERVICIOS_CLAVE_AGENDA: ${SERVICIOS_CLAVE_AGENDA}
      AGENDA_SIM_PUERTO: "9002"
    networks: [externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9002), 2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  # --- Utilidades (perfiles: no arrancan con `docker compose up`) ---
  sembrar:
    profiles: ["utilidades"]
    build:
      context: .
      target: final
    command: ["python", "manage.py", "sembrar"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
    networks: [datos, externos]
    depends_on:
      migrar:
        condition: service_completed_successfully

  pruebas:
    profiles: ["pruebas"]
    build:
      context: .
      target: pruebas
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_USUARIO_PRUEBAS: iess_pruebas
      DB_CLAVE_PRUEBAS: ${DB_CLAVE_PRUEBAS}
      # Para la prueba de roles de mínimo privilegio contra la base real (tras `migrar`):
      DB_CLAVE: ${DB_CLAVE}
      DB_MIGRACIONES_CLAVE: ${DB_MIGRACIONES_CLAVE}
      DB_AUDITORIA_RO_CLAVE: ${DB_AUDITORIA_RO_CLAVE}
      REDIS_HOST: redis
      REDIS_CLAVE: ${REDIS_CLAVE}
    networks: [datos]
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
