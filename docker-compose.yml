# Zonas de confianza de la Figura 3 del informe, reflejadas como redes de Docker Compose:
#   perimetro  -> proxy (único servicio con puertos publicados en el host)
#   aplicacion -> proxy <-> app
#   datos      -> app <-> PostgreSQL y Redis (red interna: sin salida a Internet ni puertos en el host)
#   externos   -> app <-> servicios de terceros SIMULADOS (red interna aparte)
name: iess-turnos

networks:
  perimetro: {}
  aplicacion:
    internal: true
  datos:
    internal: true
  externos:
    internal: true

volumes:
  pgdata: {}
  bandeja: {}

x-app-entorno: &app-entorno
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  URL_BASE: ${URL_BASE}
  HSTS_SEGUNDOS: ${HSTS_SEGUNDOS:-31536000}
  HMAC_TOKENS_CLAVE: ${HMAC_TOKENS_CLAVE}
  TOTP_CLAVES_CIFRADO: ${TOTP_CLAVES_CIFRADO}
  AUDITORIA_CLAVES: ${AUDITORIA_CLAVES}
  AUDITORIA_VERSION_ACTUAL: ${AUDITORIA_VERSION_ACTUAL:-1}
  DB_NAME: ${DB_NAME}
  DB_HOST: db
  REDIS_HOST: redis
  REDIS_CLAVE: ${REDIS_CLAVE}
  AFILIACION_ADAPTADOR: http
  AFILIACION_URL: http://afiliacion_sim:9001
  SERVICIOS_CLAVE_AFILIACION: ${SERVICIOS_CLAVE_AFILIACION}
  AGENDA_ADAPTADOR: http
  AGENDA_URL: http://agenda_sim:9002
  SERVICIOS_CLAVE_AGENDA: ${SERVICIOS_CLAVE_AGENDA}
  NOTIFICACIONES_ADAPTADOR: ${NOTIFICACIONES_ADAPTADOR:-consola}

services:
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:8443:8443"    # HTTPS de desarrollo (https://localhost:8443); solo accesible desde este equipo
      - "127.0.0.1:18080:8080"   # solo redirige a HTTPS (18080 para no chocar con servidores locales en 8080)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_aplicacion.conf:/etc/nginx/proxy_aplicacion.conf:ro
      - ./docker/certs:/certs:ro
    networks: [perimetro, aplicacion]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/salud"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: .
      target: final
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
    volumes:
      - bandeja:/var/bandeja
    networks: [aplicacion, datos, externos]
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      afiliacion_sim:
        condition: service_started
      agenda_sim:
        condition: service_started
    restart: unless-stopped

  # Tareas programadas: expira turnos sin confirmar (RT-05) y concilia los PENDIENTES con la agenda.
  tareas:
    build:
      context: .
      target: final
    command: ["python", "manage.py", "ejecutar_tareas", "--cada", "60"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
    networks: [datos, externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('/tmp/tareas.vivo')"]
      interval: 30s
      timeout: 4s
      retries: 3
    depends_on:
      migrar:
        condition: service_completed_successfully
    restart: unless-stopped

  # Aplica migraciones con el rol dueño del esquema (la aplicación nunca puede hacer DDL).
  migrar:
    build:
      context: .
      target: final
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_migraciones
      DB_CLAVE: ${DB_MIGRACIONES_CLAVE}
    networks: [datos]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      DB_CLAVE: ${DB_CLAVE}
      DB_MIGRACIONES_CLAVE: ${DB_MIGRACIONES_CLAVE}
      DB_AUDITORIA_RO_CLAVE: ${DB_AUDITORIA_RO_CLAVE}
      DB_CLAVE_PRUEBAS: ${DB_CLAVE_PRUEBAS}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks: [datos]   # sin "ports": PostgreSQL no se expone al host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Solo límites de solicitudes y caché: sin persistencia y sin datos personales.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_CLAVE\" --save '' --appendonly no"]
    environment:
      REDIS_CLAVE: ${REDIS_CLAVE}
      REDISCLI_AUTH: ${REDIS_CLAVE}
    networks: [datos]   # sin "ports"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Servicio de afiliación SIMULADO (tercero): autentica con token de servicio firmado y falla a propósito si se le pide.
  afiliacion_sim:
    build:
      context: .
      target: final
    command: ["python", "-m", "apps.integraciones.simulados.afiliacion_servidor"]
    environment:
      SERVICIOS_CLAVE_AFILIACION: ${SERVICIOS_CLAVE_AFILIACION}
      AFILIACION_SIM_PUERTO: "9001"
    networks: [externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9001), 2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  agenda_sim:
    build:
      context: .
      target: final
    command: ["python", "-m", "apps.integraciones.simulados.agenda_servidor"]
    environment:
      SERVICIOS_CLAVE_AGENDA: ${SERVICIOS_CLAVE_AGENDA}
      AGENDA_SIM_PUERTO: "9002"
    networks: [externos]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9002), 2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  # --- Utilidades (perfiles: no arrancan con `docker compose up`) ---
  sembrar:
    profiles: ["utilidades"]
    build:
      context: .
      target: final
    command: ["python", "manage.py", "sembrar"]
    environment:
      <<: *app-entorno
      DB_USUARIO: iess_app
      DB_CLAVE: ${DB_CLAVE}
    networks: [datos, externos]
    depends_on:
      migrar:
        condition: service_completed_successfully

  pruebas:
    profiles: ["pruebas"]
    build:
      context: .
      target: pruebas
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_USUARIO_PRUEBAS: iess_pruebas
      DB_CLAVE_PRUEBAS: ${DB_CLAVE_PRUEBAS}
      # Para la prueba de roles de mínimo privilegio contra la base real (tras `migrar`):
      DB_CLAVE: ${DB_CLAVE}
      DB_MIGRACIONES_CLAVE: ${DB_MIGRACIONES_CLAVE}
      DB_AUDITORIA_RO_CLAVE: ${DB_AUDITORIA_RO_CLAVE}
      REDIS_HOST: redis
      REDIS_CLAVE: ${REDIS_CLAVE}
    networks: [datos]
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
